<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum — habit tracker</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0c0f;
    --panel: #11151a;
    --panel-2: #151a20;
    --line: #232a33;
    --text: #eef1f5;
    --muted: #8d97a6;
    --accent: #c9f56a;
    --accent-ink: #11150a;
    --danger: #ff7a6b;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(201, 245, 106, 0.10), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(110, 168, 255, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px 56px;
  }
  .app { width: min(940px, 100%); margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  .eyebrow { letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: var(--accent); font-weight: 650; margin: 0 0 8px; }
  h1 { font-size: clamp(30px, 5vw, 46px); line-height: .98; letter-spacing: -.045em; margin: 0; font-weight: 640; }
  .date { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .score { text-align: right; min-width: 150px; }
  .score strong { font-size: 34px; letter-spacing: -.04em; display: block; line-height: 1; }
  .score span { color: var(--muted); font-size: 12px; }
  .progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 18px 0 26px; }
  .progress > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #9fe04a, var(--accent)); border-radius: inherit; transition: width .45s cubic-bezier(.2,.8,.2,1); }
  .list { display: grid; gap: 12px; }
  .habit {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    transition: border-color .25s ease, transform .25s ease;
  }
  .habit.flash { border-color: rgba(201, 245, 106, .55); transform: translateY(-1px); }
  .habit-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
  .habit-name { font-weight: 580; font-size: 15px; letter-spacing: -.01em; }
  .streak { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 5px 9px; border-radius: 99px; white-space: nowrap; }
  .streak.hot { color: var(--accent); border-color: rgba(201, 245, 106, .35); background: rgba(201, 245, 106, .06); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .day { display: grid; gap: 5px; justify-items: center; }
  .day-label { font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .day-btn {
    width: 100%; aspect-ratio: 1 / 1.05; min-height: 38px;
    border-radius: 11px; border: 1px solid var(--line); background: #0e1217;
    color: var(--muted); font: inherit; font-size: 12px; font-variant-numeric: tabular-nums;
    display: grid; place-items: center; cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
    position: relative; overflow: hidden;
  }
  .day-btn:hover { border-color: #3a4552; color: var(--text); }
  .day-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .day-btn:active { transform: scale(.94); }
  .day-btn.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .day-btn.done::after { content: "✓"; font-size: 15px; }
  .day-btn.done .num { display: none; }
  .day-btn.today { box-shadow: inset 0 0 0 1px rgba(201, 245, 106, .38); }
  .day-btn.pop { animation: pop .38s cubic-bezier(.2,1.8,.4,1); }
  @keyframes pop {
    0% { transform: scale(.8); }
    45% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .perfect {
    margin: 0 0 16px; border: 1px solid rgba(201, 245, 106, .35); background: rgba(201, 245, 106, .07);
    color: var(--accent); border-radius: 12px; padding: 11px 14px; font-size: 13px;
    display: none;
  }
  .perfect.show { display: block; animation: slide .4s ease; }
  @keyframes slide { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; color: var(--muted); font-size: 12px; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 9px; padding: 7px 11px; font: inherit; cursor: pointer; }
  button.ghost:hover { color: var(--danger); border-color: rgba(255, 122, 107, .45); }
  button.ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) {
    body { padding: 20px 12px 40px; }
    header { align-items: flex-start; flex-direction: column; }
    .score { text-align: left; }
    .days { gap: 5px; }
    .day-label { font-size: 9px; }
    .habit { padding: 13px 11px 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <p class="eyebrow">Daily practice</p>
      <h1>Momentum</h1>
      <p class="date" id="date"></p>
    </div>
    <div class="score">
      <strong id="score">0</strong>
      <span>of 35 check-ins this week</span>
    </div>
  </header>

  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <p class="perfect" id="perfect">Perfect day. All five habits done.</p>
  <section class="list" id="list" aria-label="Habits"></section>

  <footer>
    <span>Click any day in the last week to toggle it. Saved in this browser.</span>
    <button class="ghost" id="reset" type="button">Reset week</button>
  </footer>
</main>

<script>
  const STORAGE_KEY = "momentum.habits.v1";
  const DEFAULT_HABITS = [
    { id: "move", name: "Move for 20 minutes" },
    { id: "read", name: "Read 20 pages" },
    { id: "deep", name: "90 minutes of deep work" },
    { id: "phone", name: "No phone for the first hour" },
    { id: "journal", name: "Write three lines" }
  ];

  function key(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }
  function addDays(date, amount) {
    const next = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    next.setDate(next.getDate() + amount);
    return next;
  }
  function today() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }

  function load() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (parsed && Array.isArray(parsed.habits) && parsed.habits.length) return parsed;
    } catch (error) { /* first run or corrupted state */ }
    return { habits: DEFAULT_HABITS.map((habit) => ({ ...habit, days: {} })) };
  }

  let state = load();
  const list = document.querySelector("#list");
  const score = document.querySelector("#score");
  const bar = document.querySelector("#bar");
  const perfect = document.querySelector("#perfect");
  const week = [];
  const base = today();
  for (let i = 6; i >= 0; i -= 1) week.push(addDays(base, -i));

  document.querySelector("#date").textContent = new Intl.DateTimeFormat(undefined, {
    weekday: "long", month: "long", day: "numeric"
  }).format(base);

  function streak(habit) {
    let count = 0;
    for (let i = 0; i < 400; i += 1) {
      if (habit.days[key(addDays(base, -i))]) count += 1;
      else break;
    }
    return count;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (error) { /* storage can be unavailable; UI still works */ }
  }

  function render() {
    list.textContent = "";
    let total = 0;

    state.habits.forEach((habit) => {
      const card = document.createElement("article");
      card.className = "habit";
      card.dataset.habit = habit.id;

      const top = document.createElement("div");
      top.className = "habit-top";
      const name = document.createElement("span");
      name.className = "habit-name";
      name.textContent = habit.name;
      const streakEl = document.createElement("span");
      const current = streak(habit);
      streakEl.className = "streak" + (current > 0 ? " hot" : "");
      streakEl.textContent = current === 0 ? "No streak yet" : current + "-day streak";
      top.append(name, streakEl);

      const days = document.createElement("div");
      days.className = "days";
      week.forEach((date) => {
        const cell = document.createElement("div");
        cell.className = "day";
        const label = document.createElement("span");
        label.className = "day-label";
        label.textContent = new Intl.DateTimeFormat(undefined, { weekday: "short" }).format(date).slice(0, 2);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day-btn";
        const isToday = key(date) === key(base);
        const done = Boolean(habit.days[key(date)]);
        if (isToday) button.classList.add("today");
        if (done) {
          button.classList.add("done");
          total += 1;
        }
        button.setAttribute("aria-pressed", String(done));
        button.setAttribute("aria-label", habit.name + " on " + new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(date) + (done ? ", done" : ", not done"));
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = String(date.getDate());
        button.append(num);
        button.addEventListener("click", () => toggle(habit.id, key(date), card, button));
        cell.append(label, button);
        days.append(cell);
      });

      card.append(top, days);
      list.append(card);
    });

    score.textContent = String(total);
    bar.style.width = (total / 35) * 100 + "%";
    perfect.classList.toggle("show", total === 35);
  }

  function toggle(habitId, dayKey, card, button) {
    const habit = state.habits.find((item) => item.id === habitId);
    if (!habit) return;
    if (habit.days[dayKey]) delete habit.days[dayKey];
    else habit.days[dayKey] = true;
    save();
    button.classList.remove("pop");
    void button.offsetWidth;
    button.classList.add("pop");
    card.classList.add("flash");
    window.setTimeout(() => card.classList.remove("flash"), 380);
    render();
  }

  document.querySelector("#reset").addEventListener("click", () => {
    if (!window.confirm("Clear all check-ins for this week?")) return;
    state.habits.forEach((habit) => {
      week.forEach((date) => delete habit.days[key(date)]);
    });
    save();
    render();
  });

  render();
</script>
</body>
</html>
